# Adds a section to CHANGELOG.md when a release is published, listing the titles of the commits since
# the previous release tag, and commits it to the default branch. Merge commits and earlier changelog
# commits are left out. The work is done by scripts/update-changelog.py.
#
# Re-running it for a release that's already in CHANGELOG.md does nothing.
name: Changelog

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          # The whole history and tags, to find the previous release and the commits since it.
          fetch-depth: 0

      - name: Update CHANGELOG.md
        env:
          TAG: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: scripts/update-changelog.py "$TAG" "$URL" "${PUBLISHED_AT:0:10}" "$REPO_URL"

      - name: Commit
        env:
          TAG: ${{ github.event.release.tag_name }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG.md is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Update CHANGELOG.md for $TAG"
          # The branch may have moved while the changelog was built.
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
