# Builds WrangURL.app when a release is published, signs it with the Developer ID certificate, notarizes
# and staples it (scripts/release.sh), and attaches a zip, a DMG and a Sparkle appcast.xml, which
# installed copies check for updates, to the release. The tests (tests.yml) run first and must pass.
#
# Requires these secrets:
#   SPARKLE_PRIVATE_KEY              the EdDSA key whose public half is SUPublicEDKey in project.yml.
#                                    Export it with `generate_keys --account wrangurl -x <file>` (Sparkle's bin/).
#   DEVELOPER_ID_CERTIFICATE_P12     the base64-encoded .p12 of the "Developer ID Application" identity
#                                    (certificate and private key) for team 3A6RMA5S3D.
#   DEVELOPER_ID_CERTIFICATE_PASSWORD  that .p12's password.
#   NOTARY_API_KEY                   the base64-encoded .p8 of an App Store Connect API key
#                                    (Users and Access → Integrations → Team Keys, "Developer" role).
#   NOTARY_API_KEY_ID                that key's ID.
#   NOTARY_API_ISSUER_ID             the team's issuer ID, shown above the keys.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  SPARKLE_VERSION: 2.10.0

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    # NSGlassEffectView needs the macOS 26 SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install the Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_P12" ] || [ -z "$CERTIFICATE_PASSWORD" ]; then
            echo "::error::the DEVELOPER_ID_CERTIFICATE_P12 and DEVELOPER_ID_CERTIFICATE_PASSWORD secrets are not set"
            exit 1
          fi
          # xcodebuild and codesign only find identities in keychains on the search list.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"

      - name: Build, sign and notarize
        env:
          TAG: ${{ github.event.release.tag_name }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          if [ -z "$NOTARY_API_KEY" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER" ]; then
            echo "::error::the NOTARY_API_KEY, NOTARY_API_KEY_ID and NOTARY_API_ISSUER_ID secrets are not set"
            exit 1
          fi
          export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_API_KEY" | base64 --decode > "$NOTARY_KEY_PATH"
          # Tags like v1.2.3 become MARKETING_VERSION 1.2.3; the run number becomes the build number.
          VERSION="${TAG#v}" BUILD_NUMBER="${{ github.run_number }}" scripts/release.sh
          rm "$NOTARY_KEY_PATH"

      - name: Generate appcast
        env:
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_NOTES: ${{ github.event.release.body }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::the SPARKLE_PRIVATE_KEY secret is not set"
            exit 1
          fi
          curl -sSfL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir sparkle && tar -xf sparkle.tar.xz -C sparkle

          # The appcast lists only this release; Sparkle only needs the newest one.
          mkdir updates
          cp "build/release/WrangURL-${TAG#v}.zip" updates/
          printf '%s\n' "$RELEASE_NOTES" > "updates/WrangURL-${TAG#v}.md"
          echo "$SPARKLE_PRIVATE_KEY" | sparkle/bin/generate_appcast \
            --ed-key-file - \
            --embed-release-notes \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${TAG}/" \
            --link "https://github.com/${{ github.repository }}/releases" \
            updates
          cat updates/appcast.xml

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            "build/release/WrangURL-${TAG#v}.zip" \
            "build/release/WrangURL-${TAG#v}.dmg" \
            updates/appcast.xml \
            --clobber
